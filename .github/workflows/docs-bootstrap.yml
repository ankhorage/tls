name: Bootstrap generated documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies and refresh lockfile
        run: bun install

      - name: Generate Paradox documentation
        run: bun run docs

      - name: Validate generated package
        run: |
          bun run build
          bun run test
          bun run typecheck
          bun run lint
          bun run knip:check
          bun run format:check

      - name: Commit generated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git restore --staged .github/workflows/docs-bootstrap.yml || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: generate initial TLS package documentation"
          git push origin HEAD:main
