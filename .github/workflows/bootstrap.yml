name: Bootstrap Ankhorage package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install bootstrap dependencies
        run: bun install

      - name: Synchronize canonical Ankhorage repository policy
        run: bunx @ankhorage/ankh devtools sync .

      - name: Refresh lockfile after synchronization
        run: bun install

      - name: Remove one-time bootstrap workflow
        run: rm .github/workflows/bootstrap.yml

      - name: Commit synchronized package baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: synchronize Ankhorage package baseline"
          git push origin HEAD:main

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Knip
        run: bun run knip:check

      - name: Format check
        run: bun run format:check
